name=esp-rtosLogger
version=0.0.1
author=Hamza Yesilmen <resmiyslmn@gmail.com>
maintainer=Hamza Yesilmen <resmiyslmn@gmail.com>
sentence=printf style logging that costs the caller a few microseconds: arguments are queued raw, a FreeRTOS task formats them later.
paragraph=logI("rpm=%d temp=%.2f", rpm, temp) copies the arguments into a 512 byte record and posts it to a static FreeRTOS queue. A low priority task on the core you choose formats the lines with the real snprintf and writes them to Serial, or to any sink you define, batched. Safe from interrupts. Measured 3.2 us p50 per call on an ESP32-S3 at 240 MHz from a 20 kHz loop on the other core. Runs on ESP32 (Arduino-ESP32 3.x) and nRF52 (Adafruit core).
category=Communication
url=https://github.com/HamzaYslmn/esp-rtosLogger
architectures=esp32,nrf52
includes=rtosLogger.h
keywords=log logger logging printf FreeRTOS ESP32 nRF52 realtime deferred async ISR
